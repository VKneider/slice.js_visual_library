name: Component Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # Keep Playwright's browser project-local (matches playwright.config.js).
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version:` here — it would conflict with the `packageManager: pnpm@x`
      # pin in package.json (action-setup v4 errors if both are set). The pin drives it.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11.5+ (pinned via packageManager) requires Node >= 22.13 (uses node:sqlite).
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Logic tests (node:test)
        run: pnpm test

      - name: Install Playwright browser (chromium)
        run: pnpm exec playwright install --with-deps chromium

      # Default gate: DOM + behaviour + a11y (the `components` project).
      # The dev server is auto-started/stopped by Playwright's `webServer`.
      - name: Component tests (Playwright)
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
