<div class="slice-data-list__toolbar" hidden>
  <div class="slice-data-list__search"></div>
  <div class="slice-data-list__views" role="group" hidden></div>
  <div class="slice-data-list__controls"></div>
</div>
<div class="slice-data-list__bulk" hidden>
  <label class="slice-data-list__select-all">
    <input type="checkbox" class="slice-data-list__select-all-box" />
    <span class="slice-data-list__bulk-text"></span>
  </label>
  <span class="slice-data-list__bulk-actions"></span>
  <button type="button" class="slice-data-list__bulk-clear" hidden></button>
</div>
<div class="slice-data-list__notice"></div>
<div class="slice-data-list__body">
  <ul class="slice-data-list__items" role="list"></ul>
  <div class="slice-data-list__state" hidden></div>
  <div class="slice-data-list__sentinel" aria-hidden="true"></div>
</div>
<div class="slice-data-list__footer" hidden>
  <span class="slice-data-list__summary"></span>
  <span class="slice-data-list__more"></span>
  <span class="slice-data-list__pager"></span>
</div>
<div class="slice-data-list__live" aria-live="polite" aria-atomic="true"></div>
