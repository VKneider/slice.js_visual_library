<label class="slice_file_upload">
  <span class="slice_file_upload__zone">
    <span class="slice_file_upload__icon" data-el="icon" aria-hidden="true"></span>
    <span class="slice_file_upload__prompt" data-el="prompt"></span>
    <span class="slice_file_upload__hint" data-el="hint"></span>
  </span>
  <!-- Visually hidden but still focusable and clickable: the label wrapper is
       what gives us keyboard + tap for free. -->
  <input class="slice_file_upload__input" type="file" hidden />
</label>
<ul class="slice_file_upload__list" data-el="list" hidden></ul>
