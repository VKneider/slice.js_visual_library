<div class="slice-element-carrousel__viewport">
  <ul class="slice-element-carrousel__track" tabindex="0"></ul>
  <span class="slice-element-carrousel__arrow slice-element-carrousel__arrow--prev"></span>
  <span class="slice-element-carrousel__arrow slice-element-carrousel__arrow--next"></span>
</div>
<div class="slice-element-carrousel__footer">
  <span class="slice-element-carrousel__play"></span>
  <span class="slice-element-carrousel__count" aria-hidden="true" hidden></span>
  <span class="slice-element-carrousel__dots"></span>
  <div class="slice-element-carrousel__thumbs" hidden></div>
</div>
<div class="slice-element-carrousel__live" aria-live="polite" aria-atomic="true"></div>
