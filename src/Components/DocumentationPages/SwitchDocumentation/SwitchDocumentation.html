<h2 id="overview">Overview</h2>
<p><code>Switch</code> provides an on/off control for feature flags and settings toggles.</p>
<h2 id="core-behavior">Core Behavior</h2>
<ul><li><code>checked</code> controls active state.</li><li><code>label</code> and <code>labelPlacement</code> improve context readability.</li><li><code>toggle</code> callback can run side-effects when users interact.</li></ul>
